name: Tests
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
    secrets:
      CI_SECRETS_TOKEN: {required: true}
      TEST_ACCOUNT_ID: {required: true}
      TEST_REFRESH_TOKEN: {required: true}
      TEST_SCOPE: {required: true}
      MS_CLIENT_ID: {required: true}
      MS_CLIENT_SECRET: {required: false}
      MS_TENANT_ID: {required: true}
  workflow_dispatch:
    inputs:
      runner:
        description: Platform for this live run
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  test:
    name: Tests
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    environment: live-test
    concurrency:
      group: live-provider-tests
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run prepublishOnly
      - name: Seed
        id: seed
        run: node scripts/ci-tokens.ts seed
        env:
          CI_SECRETS_TOKEN: ${{ secrets.CI_SECRETS_TOKEN }}
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
          TEST_REFRESH_TOKEN: ${{ secrets.TEST_REFRESH_TOKEN }}
          TEST_SCOPE: ${{ secrets.TEST_SCOPE }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      - name: Tests
        run: npm test -- --bail
        env: &live-test-env
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
          TEST_SCOPE: ${{ secrets.TEST_SCOPE }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          TEST_INCLUDE_MANUAL: 'false'
          HEADLESS: 'true'
      - name: Engines
        run: npm run test:engines -- --bail
        env: *live-test-env
      - name: Persist
        if: always() && steps.seed.outcome != 'skipped'
        run: node scripts/ci-tokens.ts persist
        env:
          CI_SECRETS_TOKEN: ${{ secrets.CI_SECRETS_TOKEN }}
          CI_SEED_OUTCOME: ${{ steps.seed.outcome }}
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Cleanup
        if: always() && steps.checkout.outcome == 'success'
        run: node scripts/ci-tokens.ts cleanup
